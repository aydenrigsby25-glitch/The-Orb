<style>
  :root {
    --night: #0b0a1a; --ink: #edebff; --dim: #a9a4d6; --faint: #5d5785;
    --panel: rgba(24, 20, 58, 0.62); --line: rgba(180, 160, 255, 0.16);
    --gold: #f5d58a; --mint: #5fe7d4; --blue: #7fa8ff; --lilac: #c9a2ff; --violet: #8b62f2;
    --sans: "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(900px 600px at 50% 8%, #1d1548 0%, transparent 62%),
      radial-gradient(900px 600px at 100% 100%, #1a0f3a 0%, transparent 60%),
      var(--night);
    color: var(--ink); font: 15px/1.55 var(--sans);
    display: flex; flex-direction: column; align-items: center; min-height: 100vh;
  }
  #stars { position: fixed; inset: 0; pointer-events: none; }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: .2;
          animation: twinkle var(--d) ease-in-out infinite alternate; }
  @keyframes twinkle { to { opacity: var(--o); } }

  .wip { position: fixed; top: 14px; right: 14px; z-index: 5; font: 600 11px var(--sans); letter-spacing: .16em;
         text-transform: uppercase; color: var(--gold); border: 1px solid rgba(245,213,138,.45);
         background: rgba(11,10,26,.8); padding: 6px 12px; border-radius: 999px; }

  main { position: relative; z-index: 1; width: 100%; max-width: 680px; padding: 28px 18px 60px;
         display: flex; flex-direction: column; align-items: center; }

  /* emblem */
  .emblem { position: relative; width: 230px; height: 230px; margin: 6px 0 22px; cursor: pointer; }
  .wheel { position: absolute; inset: 0; width: 100%; height: 100%; }
  .halo { position: absolute; inset: 18%; border-radius: 50%;
          background: radial-gradient(circle, rgba(92,62,190,.55) 0%, rgba(60,40,140,.25) 45%, transparent 70%); }
  .orb { position: absolute; inset: 28%; border-radius: 50%;
         background: radial-gradient(circle at 37% 34%, #fff 0%, #e3fbf7 4%, #5fe7d4 15%, #78a8e8 38%, #8b62f2 60%, #5539a4 80%, #2c1e65 100%);
         box-shadow: 0 0 46px 6px rgba(139,98,242,.28); animation: breathe 5s ease-in-out infinite; }
  .orb::after { content: ""; position: absolute; inset: 0; border-radius: 50%;
                background: radial-gradient(circle at 37% 34%, rgba(255,255,255,.55), transparent 22%);
                animation: glint 7s ease-in-out infinite; }
  .emblem.spin .wheel { animation: turn 1.4s cubic-bezier(.6,.05,.4,.95); }
  @keyframes turn { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { transform: scale(1.04); } }
  @keyframes glint { 50% { transform: translate(6%, 4%); opacity: .6; } }
  h1 { margin: 0; line-height: 0; } h1 img { width: 280px; max-width: 78vw; height: auto; }
  .tagline { margin: 26px 0 26px; line-height: 0; } .tagline img { width: 150px; height: auto; }

  /* placeholders */
  .bar { display: block; height: 12px; border-radius: 6px; margin: 9px 0;
         background: linear-gradient(90deg, rgba(169,164,214,.16) 0%, rgba(169,164,214,.32) 50%, rgba(169,164,214,.16) 100%);
         background-size: 200% 100%; animation: shimmer 2.2s linear infinite; }
  .bar.big { height: 16px; } .bar.gold { background-image: linear-gradient(90deg, rgba(245,213,138,.25), rgba(245,213,138,.5), rgba(245,213,138,.25)); background-size: 200% 100%; height: 18px; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  .card { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; backdrop-filter: blur(10px); }
  .chart-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  label { display: block; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px; }
  label .req { color: var(--gold); }
  .field { height: 42px; border-radius: 10px; border: 1px solid var(--line); background: rgba(8,6,26,.7); position: relative; }
  .field::after { content: ""; position: absolute; right: 13px; top: 17px; border: 5px solid transparent; border-top-color: var(--dim); }
  .chart-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 12px; }
  .chart-foot .bar { flex: 1; max-width: 300px; margin: 0; }
  .btn { background: linear-gradient(135deg, #5fc9d6 0%, #8b62f2 55%, #5539a4 100%); border-radius: 999px; width: 150px; height: 40px; flex: none; }

  .log { width: 100%; display: flex; flex-direction: column; gap: 14px; margin-top: 22px; }
  .msg { max-width: 88%; }
  .you { align-self: flex-end; width: 240px; background: rgba(140,109,255,.16); border: 1px solid rgba(140,109,255,.3);
         padding: 6px 14px; border-radius: 16px 16px 4px 16px; }
  .orb-msg { align-self: flex-start; width: 88%; background: var(--panel); border: 1px solid var(--line);
             padding: 14px 16px; border-radius: 16px 16px 16px 4px; }
  .badge { display: inline-block; font: 600 11px var(--sans); letter-spacing: .16em; text-transform: uppercase;
           padding: 3px 10px; border-radius: 999px; margin-bottom: 4px; border: 1px solid currentColor; }
  .Yes { color: var(--gold); } .No { color: var(--blue); } .Maybe { color: var(--lilac); } .answer { color: var(--mint); }
  .anomaly { color: #fff; border-color: transparent; background: linear-gradient(90deg,#ff6ad5,#c774e8,#ad8cff,#8795e8,#94d0ff,#ff6ad5);
             background-size: 300% 100%; animation: rainbow 3s linear infinite; }
  @keyframes rainbow { to { background-position: 300% 0; } }
  .horo { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .zrow { display: flex; align-items: center; gap: 12px; }
  .zrow span { font: 600 11px var(--sans); letter-spacing: .16em; text-transform: uppercase; width: 52px; flex: none; }
  .zrow .bar { margin: 6px 0; }
  .do { color: var(--gold); } .dont { color: var(--blue); }
  .split { height: 1px; background: var(--line); margin: 6px 0; }

  .composer { width: 100%; margin-top: 30px; }
  .chips { display: flex; gap: 8px; margin-bottom: 10px; }
  .chip { width: 120px; height: 30px; border-radius: 999px; border: 1px solid var(--line); background: rgba(24,20,58,.7); }
  .input { display: flex; align-items: center; gap: 10px; background: rgba(18,15,46,.92); border: 1px solid var(--line);
           border-radius: 18px; padding: 8px 8px 8px 16px; }
  .input .bar { flex: 1; max-width: 220px; margin: 0; }
  .send { width: 42px; height: 42px; border-radius: 50%; margin-left: auto; background: linear-gradient(135deg, #5fc9d6, #8b62f2 55%, #5539a4); }

  @media (max-width: 520px) { .emblem { width: 200px; height: 200px; } .chart-row { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>

  <!-- Natal chart -->
  <section class="card">
    <div class="chart-row">
      <div><label>Sun <span class="req">✦</span></label><div class="field"></div></div>
      <div><label>Moon</label><div class="field"></div></div>
      <div><label>Rising</label><div class="field"></div></div>
    </div>
    <div class="chart-foot"><span class="bar"></span><div class="btn"></div></div>
  </section>

  <div class="log">
    <!-- Yes / No / Maybe answer -->
    <div class="msg you"><span class="bar"></span></div>
    <div class="msg orb-msg">
      <span class="badge Yes">Yes</span>
      <span class="bar big" style="width:96%"></span><span class="bar big" style="width:88%"></span><span class="bar big" style="width:62%"></span>
    </div>

    <!-- Open-ended answer -->
    <div class="msg you" style="width:200px"><span class="bar"></span></div>
    <div class="msg orb-msg">
      <span class="badge answer">Fixed answer</span>
      <span class="bar big" style="width:92%"></span><span class="bar big" style="width:74%"></span>
    </div>

    <!-- Cosmic Anomaly + unhinged horoscope -->
    <div class="msg you" style="width:260px"><span class="bar"></span></div>
    <div class="msg orb-msg">
      <span class="badge anomaly">Cosmic Anomaly</span>
      <span class="bar big" style="width:90%"></span><span class="bar big" style="width:55%"></span>
      <div class="horo">
        <span class="bar gold" style="width:58%"></span>
        <span class="bar" style="width:97%"></span><span class="bar" style="width:93%"></span><span class="bar" style="width:70%"></span>
      </div>
    </div>

    <!-- Daily Zenith -->
    <div class="msg you" style="width:140px"><span class="bar"></span></div>
    <div class="msg orb-msg">
      <div class="zrow do"><span>Do</span><i class="bar big" style="width:45%"></i></div>
      <div class="zrow do"><span>Do</span><i class="bar big" style="width:62%"></i></div>
      <div class="zrow do"><span>Do</span><i class="bar big" style="width:80%"></i></div>
      <div class="split"></div>
      <div class="zrow dont"><span>Don’t</span><i class="bar big" style="width:40%"></i></div>
      <div class="zrow dont"><span>Don’t</span><i class="bar big" style="width:66%"></i></div>
      <div class="zrow dont"><span>Don’t</span><i class="bar big" style="width:78%"></i></div>
    </div>
  </div>

  <!-- Question bar -->
  <div class="composer">
    <div class="chips"><div class="chip"></div><div class="chip" style="width:140px"></div><div class="chip" style="width:100px"></div></div>
    <div class="input"><span class="bar"></span><div class="send"></div></div>
  </div>
</main>

<script>
  const box = document.getElementById("stars");
  for (let i = 0; i < 110; i++) {
    const s = document.createElement("div"); s.className = "star";
    s.style.left = Math.random() * 100 + "%"; s.style.top = Math.random() * 100 + "%";
    s.style.setProperty("--d", (2 + Math.random() * 4).toFixed(1) + "s");
    s.style.setProperty("--o", (0.4 + Math.random() * 0.6).toFixed(2));
    box.appendChild(s);
  }
  // click the orb to see the "thinking" spin
  const em = document.getElementById("emblem");
  em.addEventListener("click", () => { em.classList.remove("spin"); void em.offsetWidth; em.classList.add("spin"); });
</script>
</body>
</html>
